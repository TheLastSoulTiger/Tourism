{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакт - Блог Калининград</title>
    <meta name="description" content="Свяжитесь с нами через форму, Telegram или WhatsApp. Мы всегда готовы помочь!">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'blog/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-dark text-light">
    <!-- Nagłówek -->
    <header class="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'home' %}">Блог Калининград</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'post_list' %}">Новости</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">Обо мне</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="{% url 'contact' %}">Контакт</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Sekcja kontaktów -->
    <section id="contact" class="container my-5">
        <h2 class="text-center mb-4">Контакты</h2>
        <p class="text-center lead">Если у вас возникли вопросы или вы хотите узнать больше, свяжитесь с нами одним из способов:</p>

        <!-- Ikony kontaktowe -->
        <div class="row justify-content-center mt-4">
            <div class="col-md-8 text-center">
                <a href="https://t.me/your_telegram_username" target="_blank" class="btn btn-primary me-3" style="background-color: #2AABEE; border: none;">
                    <i class="fab fa-telegram"></i> Telegram
                </a>
                <a href="https://wa.me/your_phone_number" target="_blank" class="btn btn-success" style="background-color: #25D366; border: none;">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
            </div>
        </div>

        <!-- Formularz kontaktowy -->
        <div class="row justify-content-center mt-5">
            <div class="col-md-8">
                <form method="POST" action="{% url 'contact' %}" class="bg-secondary p-4 rounded">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">Имя</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Сообщение</label>
                        <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-light w-100">Отправить</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Stopka -->
    <footer class="footer bg-dark py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 Блог Калининград. Все права защищены.</p>
        </div>
    </footer>

    <!-- Skrypty Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
